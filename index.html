
<script>
(() => {
  "use strict";

  // NU MODIFICA: cheia păstrează anunțurile existente.
  const STORAGE_KEY = "vandrapid_products";

  const $ = id => document.getElementById(id);
  const form = $("adForm");
  const titleEl = $("title");
  const priceEl = $("price");
  const descEl = $("description");
  const galleryInput = $("galleryInput");
  const cameraInput = $("cameraInput");
  const preview = $("preview");
  const list = $("list");

  let selectedPhotos = [];
  let editingId = null;
  let products = loadProducts();

  function loadProducts() {
    try {
      const value = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      return Array.isArray(value) ? value : [];
    } catch (e) {
      alert("Nu s-au putut citi anunțurile salvate. Nu modifica stocarea existentă.");
      return [];
    }
  }

  function saveProducts() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
      return true;
    } catch (e) {
      alert("Spațiul de stocare este plin. Anunțurile nu au fost salvate. Nu șterge datele existente.");
      return false;
    }
  }

  function makeId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function showPreview() {
    preview.innerHTML = "";

    selectedPhotos.forEach((src, index) => {
      const item = document.createElement("div");
      item.className = "preview-item";

      const img = document.createElement("img");
      img.src = src;
      img.alt = "Fotografie " + (index + 1);

      const remove = document.createElement("button");
      remove.type = "button";
      remove.textContent = "✕";

      remove.addEventListener("click", () => {
        selectedPhotos.splice(index, 1);
        showPreview();
      });

      item.append(img, remove);
      preview.append(item);
    });
  }

  function readImage(file) {
    return new Promise((resolve, reject) => {
      if (!file.type.startsWith("image/")) {
        return reject(new Error("Fișierul nu este o imagine."));
      }

      const reader = new FileReader();

      reader.onerror = () => reject(new Error("Fotografia nu a putut fi citită."));

      reader.onload = () => {
        const image = new Image();

        image.onerror = () => reject(new Error("Imaginea nu poate fi deschisă."));

        image.onload = () => {
          const maxSide = 1400;
          const scale = Math.min(1, maxSide / Math.max(image.width, image.height));

          const canvas = document.createElement("canvas");
          canvas.width = Math.max(1, Math.round(image.width * scale));
          canvas.height = Math.max(1, Math.round(image.height * scale));

          const ctx = canvas.getContext("2d");
          ctx.drawImage(image, 0, 0, canvas.width, canvas.height);

          resolve(canvas.toDataURL("image/jpeg", 0.78));
        };

        image.src = reader.result;
      };

      reader.readAsDataURL(file);
    });
  }

  async function handleFiles(input) {
    const files = Array.from(input.files || []);
    input.value = "";

    if (!files.length) return;

    const available = 10 - selectedPhotos.length;

    if (available <= 0) {
      alert("Ai atins limita de 10 fotografii.");
      return;
    }

    if (files.length > available) {
      alert("Poți adăuga încă " + available + " fotografii.");
    }

    for (const file of files.slice(0, available)) {
      try {
        selectedPhotos.push(await readImage(file));
      } catch (err) {
        alert(err.message);
      }
    }

    showPreview();
  }

  galleryInput.addEventListener("change", () => handleFiles(galleryInput));
  cameraInput.addEventListener("change", () => handleFiles(cameraInput));

  function resetForm() {
    form.reset();
    selectedPhotos = [];
    editingId = null;
    showPreview();

    $("formTitle").textContent = "Adaugă un anunț";
    $("saveBtn").textContent = "Publică anunțul";
    $("cancelEdit").hidden = true;
  }

  $("cancelEdit").addEventListener("click", resetForm);

  form.addEventListener("submit", event => {
    event.preventDefault();

    const title = titleEl.value.trim();

    if (!title) {
      alert("Completează titlul anunțului.");
      titleEl.focus();
      return;
    }

    const price = priceEl.value.trim();
    const description = descEl.value.trim();

    const oldProducts = products;

    if (editingId) {
      const index = products.findIndex(p => p.id === editingId);

      if (index >= 0) {
        products[index] = {
          ...products[index],
          title,
          price,
          description,
          photos: selectedPhotos,
          updatedAt: new Date().toISOString()
        };
      }
    } else {
      products.unshift({
        id: makeId(),
        title,
        price,
        description,
        photos: selectedPhotos,
        createdAt: new Date().toISOString()
      });
    }

    if (!saveProducts()) {
      products = oldProducts;
      return;
    }

    resetForm();
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  function editProduct(id) {
    const p = products.find(x => x.id === id);
    if (!p) return;

    editingId = id;
    titleEl.value = p.title || "";
    priceEl.value = p.price || "";
    descEl.value = p.description || "";

    selectedPhotos = Array.isArray(p.photos) ? [...p.photos] : [];

    $("formTitle").textContent = "Editează anunțul";
    $("saveBtn").textContent = "Salvează modificările";
    $("cancelEdit").hidden = false;

    showPreview();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function deleteProduct(id) {
    if (!confirm("Ștergi definitiv acest anunț?")) return;

    const oldProducts = products;
    products = products.filter(p => p.id !== id);

    if (!saveProducts()) {
      products = oldProducts;
      return;
    }

    if (editingId === id) resetForm();

    render();
  }

  function shareText(p) {
    return [
      p.title,
      p.price ? "Preț: " + p.price + " lei" : "",
      p.description || "",
      "Anunț publicat prin Vând Rapid"
    ].filter(Boolean).join("\n");
  }

  async function shareToApps(p) {
    const text = shareText(p);

    if (navigator.share) {
      try {
        const files = [];

        for (let i = 0; i < (p.photos || []).length; i++) {
          const response = await fetch(p.photos[i]);
          const blob = await response.blob();

          files.push(
            new File([blob], "vand-rapid-" + (i + 1) + ".jpg", {
              type: "image/jpeg"
            })
          );
        }

        if (files.length && navigator.canShare && navigator.canShare({ files })) {
          await navigator.share({
            title: p.title,
            text,
            files
          });
        } else {
          await navigator.share({
            title: p.title,
            text
          });
        }

        return;
      } catch (err) {
        if (err && err.name === "AbortError") return;
      }
    }

    try {
      await navigator.clipboard.writeText(text);
      alert("Textul anunțului a fost copiat.");
    } catch (e) {
      prompt("Copiază textul anunțului:", text);
    }
  }

  function shareProduct(p) {
    shareToApps(p);
  }

  function shareWhatsApp(p) {
    shareToApps(p);
  }

  function shareFacebook(p) {
    shareToApps(p);
  }

  function shareTikTok(p) {
    shareToApps(p);
  }

  // Marketplace este definit separat, nu în actions.append().
  async function shareMarketplace(p) {
    const text = shareText(p);

    try {
      await navigator.clipboard.writeText(text);
      alert("Textul anunțului a fost copiat. Lipește-l în Marketplace și adaugă fotografiile.");
    } catch (e) {
      prompt("Copiază textul anunțului:", text);
    }

    window.open(
      "https://www.facebook.com/marketplace/create/item/",
      "_blank",
      "noopener"
    );
  }

  function render() {
    const query = $("search").value.trim().toLocaleLowerCase("ro");

    const filtered = products.filter(p =>
      [p.title, p.description, p.price]
        .join(" ")
        .toLocaleLowerCase("ro")
        .includes(query)
    );

    list.innerHTML = "";

    if (!filtered.length) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = products.length
        ? "Nu am găsit anunțuri pentru această căutare."
        : "Nu ai anunțuri încă. Adaugă primul produs mai sus!";

      list.append(empty);
      return;
    }

    filtered.forEach(p => {
      const card = document.createElement("article");
      card.className = "product";

      const photos = Array.isArray(p.photos) ? p.photos : [];

      const photoBox = document.createElement("div");
      photoBox.className = "product-photos";

      if (photos.length) {
        photos.slice(0, 6).forEach((src, i) => {
          const img = document.createElement("img");
          img.src = src;
          img.alt = "Fotografie " + (i + 1);
          img.loading = "lazy";
          photoBox.append(img);
        });
      } else {
        const no = document.createElement("div");
        no.className = "empty";
        no.textContent = "Fără fotografii";
        photoBox.append(no);
      }

      const body = document.createElement("div");
      body.className = "product-body";

      const h = document.createElement("h3");
      h.textContent = p.title || "Anunț fără titlu";

      const price = document.createElement("div");
      price.className = "price";
      price.textContent = p.price ? p.price + " lei" : "Preț la cerere";

      const description = document.createElement("div");
      description.className = "description";
      description.textContent = p.description || "";

      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = photos.length + " fotografii";

      const actions = document.createElement("div");
      actions.className = "actions";

      const makeButton = (label, cls, fn) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = cls;
        b.textContent = label;
        b.addEventListener("click", fn);
        return b;
      };

      // AICI RĂMÂN DOAR BUTOANELE.
      actions.append(
        makeButton("Editează", "secondary", () => editProduct(p.id)),
        makeButton("Distribuie", "primary", () => shareProduct(p)),
        makeButton("WhatsApp", "secondary", () => shareWhatsApp(p)),
        makeButton("Facebook", "secondary", () => shareFacebook(p)),
        makeButton("Marketplace", "secondary", () => shareMarketplace(p)),
        makeButton("TikTok / Altele", "secondary", () => shareTikTok(p)),
        makeButton("Șterge", "danger", () => deleteProduct(p.id))
      );

      body.append(h, price, description, meta, actions);
      card.append(photoBox, body);
      list.append(card);
    });
  }

  $("search").addEventListener("input", render);

  $("clearSearch").addEventListener("click", () => {
    $("search").value = "";
    render();
  });

  render();
})();
</script>
