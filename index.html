
<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#153b35">
<title>Vând Rapid</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f4f2;color:#18332b;font-family:Arial}
header{background:#153b35;color:white;text-align:center;padding:20px}
header h1{margin:0}
main{max-width:650px;margin:auto;padding:14px}
.card{background:white;padding:16px;border-radius:14px;margin-bottom:15px}
label{display:block;font-weight:bold;margin:13px 0 6px}
input,textarea{width:100%;padding:13px;border:1px solid #ccc;border-radius:9px;font-size:16px}
textarea{min-height:80px}
button{border:0;border-radius:9px;padding:12px;font-size:14px;font-weight:bold;cursor:pointer}
.primary{background:#153b35;color:white;width:100%;margin-top:15px}
.cancel{background:#777;color:white;width:100%;margin-top:8px}
.pick{display:block;text-align:center;padding:14px;border-radius:9px;color:white;font-weight:bold;margin:8px 0}
.camera{background:#16834b}
.galleryButton{background:#1877f2}
.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.galleryItem{position:relative}
.galleryItem img{width:100%;height:140px;object-fit:cover;border-radius:9px}
.galleryItem button{position:absolute;right:5px;top:5px;background:#c0392b;color:white}
.product{border-bottom:1px solid #ddd;padding:14px 0}
.productPhotos{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.productPhotos img{width:100%;height:150px;object-fit:contain;background:#f5f5f5;border-radius:8px}
.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.actions button{background:#16834b;color:white}
.actions .facebook{background:#1877f2}
.actions .tiktok{background:#111}
.actions .share{background:#153b35;grid-column:1/-1}
.actions .edit{background:#e6a126;color:#222}
.delete{background:#c0392b;color:white;width:100%;margin-top:10px}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
#status{font-size:14px;color:#1877f2}
.empty{text-align:center;color:#777;padding:20px}
</style>
</head>
<body>

<header>
<h1>🛍️ VÂND RAPID</h1>
<p>Produsele tale, gata de vânzare!</p>
</header>

<main>
<section class="card">
<h2 id="formTitle">➕ Adaugă produs</h2>

<label>Fotografii produs (maximum 10)</label>
<label class="pick camera" for="cameraInput">📷 FĂ FOTOGRAFIE</label>
<input type="file" id="cameraInput" accept="image/*" capture="environment">

<label class="pick galleryButton" for="galleryInput">🖼️ ALEGE DIN GALERIE</label>
<input type="file" id="galleryInput" accept="image/*" multiple>

<p id="status">Poți adăuga fotografii din cameră sau galerie.</p>
<div id="gallery" class="gallery"></div>

<label>Denumire produs</label>
<input id="name" placeholder="Ex: Telefon Samsung">

<label>Preț (lei)</label>
<input id="price" type="number" min="0" placeholder="Ex: 500">

<label>Descriere</label>
<textarea id="description" placeholder="Descrie produsul..."></textarea>

<button class="primary" id="save">SALVEAZĂ PRODUSUL</button>
<button class="cancel" id="cancel" hidden>ANULEAZĂ EDITAREA</button>
</section>

<section class="card">
<h2>📦 Produsele mele</h2>
<div id="products"></div>
</section>
</main>

<script>
let products=[];
let selectedPhotos=[];
let editingId=null;
let processing=false;

try{
products=JSON.parse(localStorage.getItem("vandrapid_products")||"[]");
if(!Array.isArray(products))products=[];
}catch(e){products=[];}

const $=id=>document.getElementById(id);
const gallery=$("gallery");
const status=$("status");
const cameraInput=$("cameraInput");
const galleryInput=$("galleryInput");

function saveStorage(){
localStorage.setItem("vandrapid_products",JSON.stringify(products));
}

function readBlob(blob){
return new Promise((resolve,reject)=>{
const reader=new FileReader();
reader.onload=()=>resolve(reader.result);
reader.onerror=()=>reject(Error("Nu pot citi fotografia."));
reader.readAsDataURL(blob);
});

}

async function convertPhoto(file){
if(!file.type.startsWith("image/"))
throw Error("Fișierul nu este o fotografie.");

let bitmap=null,img=null,url=null;

try{
if("createImageBitmap" in window)
bitmap=await createImageBitmap(file);
}catch(e){bitmap=null;}

let width,height,source;

if(bitmap){
width=bitmap.width;
height=bitmap.height;
source=bitmap;
}else{
url=URL.createObjectURL(file);
img=new Image();

await new Promise((resolve,reject)=>{
img.onload=resolve;
img.onerror=()=>reject(Error("Nu pot deschide fotografia."));
img.src=url;
});

width=img.naturalWidth;
height=img.naturalHeight;
source=img;
}

if(!width||!height)
throw Error("Fotografie invalidă.");

const scale=Math.min(1,900/Math.max(width,height));
const canvas=document.createElement("canvas");
canvas.width=Math.max(1,Math.round(width*scale));
canvas.height=Math.max(1,Math.round(height*scale));

const ctx=canvas.getContext("2d");
if(!ctx)throw Error("Eroare la pregătirea fotografiei.");

ctx.fillStyle="#fff";
ctx.fillRect(0,0,canvas.width,canvas.height);
ctx.drawImage(source,0,0,canvas.width,canvas.height);

if(bitmap)bitmap.close();
if(url)URL.revokeObjectURL(url);

const blob=await new Promise((resolve,reject)=>{
canvas.toBlob(b=>b?resolve(b):reject(Error("Nu pot comprima fotografia.")),"image/jpeg",0.65);
});

canvas.width=1;
canvas.height=1;

return await readBlob(blob);
}

function showGallery(){
gallery.innerHTML="";

selectedPhotos.forEach((photo,index)=>{
const box=document.createElement("div");
box.className="galleryItem";

const img=document.createElement("img");
img.src=photo;
img.alt="Fotografie produs";

const del=document.createElement("button");
del.textContent="✕";
del.type="button";
del.onclick=()=>{
selectedPhotos.splice(index,1);
showGallery();
status.textContent=selectedPhotos.length+" fotografii selectate.";
};

box.append(img,del);
gallery.append(box);
});
}

async function addFiles(files){
if(processing)return;

const chosen=Array.from(files);
if(!chosen.length)return;

const remaining=10-selectedPhotos.length;

if(remaining<=0){
alert("Ai deja 10 fotografii!");
return;
}

if(chosen.length>remaining)
alert("Poți adăuga doar încă "+remaining+" fotografii.");

processing=true;
cameraInput.disabled=true;
galleryInput.disabled=true;

let successful=0,failed=0;

try{
for(let i=0;i<chosen.slice(0,remaining).length;i++){
status.textContent="Se încarcă fotografia "+(i+1)+"...";

try{
const photo=await convertPhoto(chosen[i]);
selectedPhotos.push(photo);
successful++;
showGallery();
}catch(e){
failed++;
status.textContent=e.message;
}
}
}finally{
processing=false;
cameraInput.disabled=false;
galleryInput.disabled=false;
}

status.textContent=successful+" fotografii încărcate. "+(failed?"Fotografii nereușite: "+failed: "Totul este în regulă!");
}

cameraInput.addEventListener("change",async()=>{
await addFiles(cameraInput.files);
cameraInput.value="";
});

galleryInput.addEventListener("change",async()=>{
await addFiles(galleryInput.files);
galleryInput.value="";
});

function resetForm(){
editingId=null;
selectedPhotos=[];
$("name").value="";
$("price").value="";
$("description").value="";
$("formTitle").textContent="➕ Adaugă produs";
$("save").textContent="SALVEAZĂ PRODUSUL";
$("cancel").hidden=true;
showGallery();
status.textContent="Poți adăuga fotografii din cameră sau galerie.";
}

$("cancel").onclick=resetForm;

$("save").onclick=()=>{
const name=$("name").value.trim();
const price=$("price").value.trim();
const description=$("description").value.trim();

if(processing){
alert("Așteaptă încărcarea fotografiilor!");
return;
}

if(!name||!price||Number(price)<0){
alert("Completează corect denumirea și prețul!");
return;
}

if(!selectedPhotos.length){
alert("Adaugă cel puțin o fotografie!");
return;
}

let updated=[...products];

if(editingId!==null){
const index=updated.findIndex(p=>p.id===editingId);
if(index<0){
alert("Produsul nu mai există.");
return;
}
updated[index]={
...updated[index],name,price,description,
photos:[...selectedPhotos]
};
}else{
updated.unshift({
id:Date.now(),
name,price,description,
photos:[...selectedPhotos]
});
}

try{
localStorage.setItem("vandrapid_products",JSON.stringify(updated));
products=updated;
resetForm();
showProducts();
alert("Produs salvat cu succes!");
}catch(e){
alert("Memoria telefonului este insuficientă. Redu numărul fotografiilor sau dimensiunea lor.");
}
};

function editProduct(p){
editingId=p.id;
selectedPhotos=[...(p.photos||(p.photo?[p.photo]:[]))];

$("name").value=p.name;
$("price").value=p.price;
$("description").value=p.description||"";

$("formTitle").textContent="✏️ Editează produsul";
$("save").textContent="SALVEAZĂ MODIFICĂRILE";
$("cancel").hidden=false;

showGallery();
status.textContent="Editezi: "+p.name;

window.scrollTo({top:0,behavior:"smooth"});
}

function photoToFile(data,index){
const parts=data.split(",");
const mime=parts[0].match(/:(.*?);/)[1];
const binary=atob(parts[1]);
const bytes=new Uint8Array(binary.length);

for(let i=0;i<binary.length;i++)
bytes[i]=binary.charCodeAt(i);

return new File([bytes],"vandrapid-"+(index+1)+".jpg",{type:mime});
}

async function shareProduct(p){
const photos=p.photos||(p.photo?[p.photo]:[]);
const text=p.name+"\nPreț: "+p.price+" lei\n"+(p.description||"");

try{
const files=photos.map(photoToFile);

if(navigator.share){
if(files.length&&navigator.canShare&&navigator.canShare({files})){
await navigator.share({
title:p.name,
text,
files
});
}else{
await navigator.share({title:p.name,text});
}
}else if(navigator.clipboard){
await navigator.clipboard.writeText(text);
alert("Anunț copiat!");
}else{
alert("Distribuirea nu este disponibilă.");
}
}catch(e){
if(e.name!=="AbortError")
alert("Distribuirea nu a reușit.");
}
}

function whatsapp(p){
const text=p.name+" - "+p.price+" lei\n"+(p.description||"");
window.open("https://wa.me/?text="+encodeURIComponent(text),"_blank");
}

function facebook(p){
const text=p.name+" - "+p.price+" lei\n"+(p.description||"");
if(navigator.clipboard){
navigator.clipboard.writeText(text).catch(()=>{});
}
window.open("https://www.facebook.com/sharer/sharer.php?u="+encodeURIComponent(location.href),"_blank");
alert("Textul anunțului a fost copiat. Îl poți lipi în postarea Facebook.");
}

async function tiktok(p){
await shareProduct(p);
}

function showProducts(){
const area=$("products");
area.innerHTML="";

if(!products.length){
area.innerHTML='<div class="empty">Nu ai produse încă.<br>Adaugă primul tău produs!</div>';
return;
}

products.forEach(p=>{
const div=document.createElement("div");
div.className="product";

const title=document.createElement("h3");
title.textContent=p.name;

const price=document.createElement("strong");
price.textContent=p.price+" lei";

const desc=document.createElement("p");
desc.textContent=p.description||"";

div.append(title,price,desc);

const photos=p.photos||(p.photo?[p.photo]:[]);
const photoBox=document.createElement("div");
photoBox.className="productPhotos";

photos.forEach(src=>{
const img=document.createElement("img");
img.src=src;
img.alt=p.name;
photoBox.append(img);
});

div.append(photoBox);

const actions=document.createElement("div");
actions.className="actions";

const wa=document.createElement("button");
wa.textContent="WhatsApp";
wa.onclick=()=>whatsapp(p);

const fb=document.createElement("button");
fb.className="facebook";
fb.textContent="Facebook";
fb.onclick=()=>facebook(p);

const tt=document.createElement("button");
tt.className="tiktok";
tt.textContent="TikTok";
tt.onclick=()=>tiktok(p);

const edit=document.createElement("button");
edit.className="edit";
edit.textContent="✏️ EDITEAZĂ";
edit.onclick=()=>editProduct(p);

const share=document.createElement("button");
share.className="share";
share.textContent="📤 DISTRIBUIE FOTOGRAFIILE ȘI ANUNȚUL";
share.onclick=()=>shareProduct(p);

actions.append(wa,fb,tt,edit,share);

const del=document.createElement("button");
del.className="delete";
del.textContent="ȘTERGE PRODUSUL";

del.onclick=()=>{
if(!confirm("Sigur vrei să ștergi produsul "+p.name+"?"))return;

const updated=products.filter(item=>item.id!==p.id);

try{
localStorage.setItem("vandrapid_products",JSON.stringify(updated));
products=updated;

if(editingId===p.id)resetForm();

showProducts();
}catch(e){
alert("Nu am putut actualiza lista.");
}
};

div.append(actions,del);
area.append(div);
});
}

showProducts();
</script>
</body>
</html>
